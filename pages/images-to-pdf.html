    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg-light); color: var(--text-dark); font-family: 'Noto Sans TC', sans-serif; }
        main { max-width: 1120px; margin: auto; padding: 44px 20px 64px; min-height: calc(100vh - 180px); animation: fadeInUp .4s ease; }
        h1 { margin: 0 0 12px; font-size: clamp(26px, 4vw, 36px); }
        .intro { color: var(--text-muted); margin-bottom: 28px; line-height: 1.8; }
        .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 24px; align-items: start; }
        .panel { background: white; border: 1px solid #eee5dc; border-radius: 20px; padding: 24px; box-shadow: 0 8px 28px #50301408; min-width: 0; }
        .drop-zone { display: block; width: 100%; border: 2px dashed #f5bb78; background: #fff9f1; border-radius: 16px; text-align: center; padding: 34px 18px; cursor: pointer; color: var(--text-dark); }
        .drop-zone:hover, .drop-zone.drag-over { border-color: var(--primary-color); background: #fff0dc; }
        .upload-icon { display: block; color: var(--primary-color); font-size: 32px; margin-bottom: 12px; }
        .hint { font-size: 13px; color: var(--text-muted); line-height: 1.8; }
        .list-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 22px 0 12px; }
        .image-list { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
        .image-row { display: flex; align-items: center; gap: 14px; border: 1px solid #eee5dc; border-radius: 12px; padding: 12px; }
        .thumbnail { width: 64px; height: 76px; object-fit: contain; flex-shrink: 0; background: #f8f6f3; border-radius: 6px; }
        .image-info { min-width: 0; flex: 1; }
        .image-name { display: block; font-size: 14px; overflow-wrap: anywhere; }
        .row-actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 150px; }
        button, input, select { font: inherit; }
        button { transition: background .2s, transform .2s; }
        button:disabled { opacity: .45; cursor: not-allowed; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #ffb75f; outline-offset: 3px; }
        .small-btn { border: 1px solid #eee5dc; background: white; border-radius: 8px; padding: 7px 10px; cursor: pointer; color: var(--text-dark); font-size: 13px; }
        .small-btn:hover:not(:disabled) { background: #fff0dc; }
        .field { display: block; margin: 0 0 20px; font-size: 14px; font-weight: 500; }
        .field select, .field input { display: block; width: 100%; padding: 11px; border: 1px solid #ded8d1; border-radius: 10px; margin-top: 8px; background: white; color: var(--text-dark); min-width: 0; }
        .export-btn { width: 100%; border: none; border-radius: 12px; padding: 14px; background: linear-gradient(120deg, #ff9500, #ef7600); color: white; font-weight: 700; cursor: pointer; }
        .export-btn:hover:not(:disabled) { transform: translateY(-2px); }
        #status { min-height: 24px; margin: 16px 0 0; font-size: 14px; overflow-wrap: anywhere; }
        #emptyState { text-align: center; padding: 24px 10px; color: var(--text-muted); font-size: 14px; }
        @media (max-width: 760px) { .workspace { grid-template-columns: 1fr; } main { padding-top: 28px; } .panel { padding: 18px; } }
        @media (max-width: 420px) { .image-row { flex-wrap: wrap; } .row-actions { width: 100%; max-width: none; } }

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="nav-logo">
                <i class="fa-solid fa-toolbox"></i> Life Tools
            </a>
            <div class="nav-right">
                <a href="about.html" class="nav-link">關於我們</a>
                <div class="search-box">
                    <input type="text" id="navSearchInput" class="search-input" placeholder="搜尋工具...">
                    <button id="navSearchBtn" class="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

    <main>
        <h1><i class="fa-solid fa-file-pdf" aria-hidden="true"></i> 圖片合併成 PDF</h1>
        <p class="intro">把照片、掃描文件或截圖整理成一份 PDF。一張圖片一頁，依照下方順序合併，圖片不會上傳到伺服器。</p>
        <div class="workspace">
            <section class="panel" aria-label="圖片清單">
                <button type="button" class="drop-zone" id="dropZone">
                    <i class="fa-solid fa-images upload-icon" aria-hidden="true"></i>
                    <strong>點擊選擇圖片，或拖曳到這裡</strong><br>
                    <span class="hint">支援 JPG、PNG、WebP，可分批加入<br>最多 100 張，每張上限 25 MB</span>
                </button>
                <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
                <div class="list-header"><strong id="imageCount">尚未加入圖片</strong><button class="small-btn" id="clearBtn" disabled>全部清除</button></div>
                <p id="emptyState">加入圖片後，即可預覽、調整順序與旋轉。</p>
                <ol class="image-list" id="imageList"></ol>
            </section>
            <section class="panel" aria-label="PDF 設定">
                <h2 style="margin-top:0;font-size:19px">PDF 設定</h2>
                <label class="field" for="pageOrientation">A4 頁面方向
                    <select id="pageOrientation"><option value="auto">自動（依圖片方向）</option><option value="portrait">直向</option><option value="landscape">橫向</option></select>
                </label>
                <label class="field" for="pageMargin">頁面留白
                    <select id="pageMargin"><option value="10">四邊 10 mm</option><option value="0">無留白</option><option value="20">四邊 20 mm</option></select>
                </label>
                <label class="field" for="pdfFilename">檔案名稱<input id="pdfFilename" value="合併圖片" maxlength="100"></label>
                <p class="hint">圖片等比例置中、不裁切。透明區域轉為白底，較大的圖片會適度縮小以控制檔案大小。</p>
                <button class="export-btn" id="exportBtn" disabled><i class="fa-solid fa-download" aria-hidden="true"></i> 合併並下載 PDF</button>
                <p id="status" role="status" aria-live="polite"></p>
            </section>
        </div>
    </main>
    <footer class="footer">&copy; 0xseanlee, all rights reserved.</footer>
    <div class="modal-overlay" id="errorModal" role="dialog" aria-modal="true" aria-labelledby="errorTitle">
        <div class="modal-card"><h2 class="modal-title" id="errorTitle">提示</h2><p class="modal-body" id="errorModalBody"></p><button class="modal-close-btn" onclick="closeErrorModal()">知道了</button></div>
    </div>
    <script>
        let imageItems = [];
        let isBusy = false;
        const imageList = document.getElementById('imageList');
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const exportBtn = document.getElementById('exportBtn');
        const statusText = document.getElementById('status');

        // 根據工作狀態統一鎖定操作，避免匯出時清單改變。
        function updateControls() {
            dropZone.disabled = isBusy;
            imageInput.disabled = isBusy;
            exportBtn.disabled = isBusy || imageItems.length === 0;
            document.getElementById('clearBtn').disabled = isBusy || imageItems.length === 0;
            document.querySelectorAll('.field input, .field select, .row-actions button').forEach(element => { element.disabled = isBusy; });
            if (!isBusy) {
                imageList.querySelectorAll('.image-row').forEach((row, index) => {
                    row.querySelector('[data-action="up"]').disabled = index === 0;
                    row.querySelector('[data-action="down"]').disabled = index === imageItems.length - 1;
                });
            }
        }

        // 以 DOM 文字節點顯示檔名，避免將使用者檔名當成 HTML。
        function renderImages() {
            imageList.replaceChildren();
            imageItems.forEach((item, index) => {
                const row = document.createElement('li');
                row.className = 'image-row';
                const image = document.createElement('img');
                image.className = 'thumbnail';
                image.src = item.url;
                image.alt = item.name;
                image.style.transform = `rotate(${item.rotation}deg)`;
                const info = document.createElement('div');
                info.className = 'image-info';
                const name = document.createElement('strong');
                name.className = 'image-name';
                name.textContent = `${index + 1}. ${item.name}`;
                const size = document.createElement('span');
                size.className = 'hint';
                size.textContent = `${item.width} × ${item.height} · ${(item.file.size / 1048576).toFixed(1)} MB`;
                info.append(name, size);
                const actions = document.createElement('div');
                actions.className = 'row-actions';
                [['up', '上移'], ['down', '下移'], ['rotate', '旋轉'], ['remove', '移除']].forEach(([action, label]) => {
                    const button = document.createElement('button');
                    button.className = 'small-btn';
                    button.textContent = label;
                    button.dataset.action = action;
                    button.setAttribute('aria-label', `${label}第 ${index + 1} 張圖片`);
                    button.addEventListener('click', () => editImage(index, action));
                    actions.appendChild(button);
                });
                row.append(image, info, actions);
                imageList.appendChild(row);
            });
            document.getElementById('imageCount').textContent = imageItems.length ? `共 ${imageItems.length} 張圖片 · ${imageItems.length} 頁` : '尚未加入圖片';
            document.getElementById('emptyState').hidden = imageItems.length > 0;
            updateControls();
        }

        // 單張圖片解碼成功後才加入清單，損毀檔案顯示可恢復的錯誤。
        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error('無法讀取圖片，請確認檔案未損毀。'));
                image.src = url;
            });
        }

        // 逐張讀取，維持選檔順序並限制單檔大小及總張數。
        async function addImages(files) {
            if (isBusy || !files.length) return;
            isBusy = true;
            updateControls();
            const failures = [];
            try {
                for (const file of files) {
                    if (imageItems.length >= 100) { failures.push('最多可加入 100 張圖片。'); break; }
                    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) { failures.push(`${file.name}：請使用 JPG、PNG 或 WebP。`); continue; }
                    if (file.size > 25 * 1048576) { failures.push(`${file.name}：檔案超過 25 MB。`); continue; }
                    statusText.textContent = `正在讀取 ${file.name}…`;
                    const url = URL.createObjectURL(file);
                    try {
                        const image = await loadImage(url);
                        imageItems.push({ file, url, name: file.name, width: image.naturalWidth, height: image.naturalHeight, rotation: 0 });
                        image.src = '';
                    } catch (error) { URL.revokeObjectURL(url); failures.push(`${file.name}：${error.message}`); }
                }
            } finally {
                isBusy = false;
                imageInput.value = '';
                statusText.textContent = imageItems.length ? '圖片已就緒，可調整順序後下載。' : '';
                renderImages();
                if (failures.length) showModal(failures.slice(0, 5).join('\n'));
            }
        }

        // 排序、順時針旋轉或移除指定圖片。
        function editImage(index, action) {
            if (isBusy) return;
            if (action === 'remove') { URL.revokeObjectURL(imageItems[index].url); imageItems.splice(index, 1); }
            else if (action === 'rotate') imageItems[index].rotation = (imageItems[index].rotation + 90) % 360;
            else {
                const target = index + (action === 'up' ? -1 : 1);
                if (target < 0 || target >= imageItems.length) return;
                [imageItems[index], imageItems[target]] = [imageItems[target], imageItems[index]];
            }
            statusText.textContent = '';
            renderImages();
        }

        // 圖片等比例縮放至 A4 可用範圍，保留完整內容。
        function fitImage(width, height, pageWidth, pageHeight, margin) {
            const scale = Math.min((pageWidth - margin * 2) / width, (pageHeight - margin * 2) / height);
            return { width: width * scale, height: height * scale, x: (pageWidth - width * scale) / 2, y: (pageHeight - height * scale) / 2 };
        }

        // 逐頁繪製白底圖片並匯出，避免同時建立所有大型畫布。
        async function exportPdf() {
            if (isBusy || !imageItems.length) return;
            if (!window.jspdf) { showModal('PDF 元件載入失敗，請重新整理後再試。'); return; }
            isBusy = true;
            updateControls();
            const orientation = document.getElementById('pageOrientation').value;
            const margin = Number(document.getElementById('pageMargin').value);
            let pdf;
            try {
                for (let index = 0; index < imageItems.length; index++) {
                    statusText.textContent = `正在製作第 ${index + 1} / ${imageItems.length} 頁…`;
                    await new Promise(resolve => setTimeout(resolve, 0));
                    const item = imageItems[index];
                    const image = await loadImage(item.url);
                    const sideways = item.rotation % 180 !== 0;
                    const width = sideways ? item.height : item.width;
                    const height = sideways ? item.width : item.height;
                    const pageDirection = orientation === 'auto' ? (width > height ? 'landscape' : 'portrait') : orientation;
                    if (!pdf) pdf = new window.jspdf.jsPDF({ orientation: pageDirection, unit: 'mm', format: 'a4', compress: true });
                    else pdf.addPage('a4', pageDirection);
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(1, 2400 / Math.max(width, height));
                    canvas.width = Math.max(1, Math.round(width * scale));
                    canvas.height = Math.max(1, Math.round(height * scale));
                    const context = canvas.getContext('2d');
                    if (!context) throw new Error('瀏覽器無法處理圖片，請減少圖片大小後重試。');
                    context.fillStyle = '#fff';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    context.translate(canvas.width / 2, canvas.height / 2);
                    context.rotate(item.rotation * Math.PI / 180);
                    context.drawImage(image, -item.width * scale / 2, -item.height * scale / 2, item.width * scale, item.height * scale);
                    const placement = fitImage(width, height, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight(), margin);
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', placement.x, placement.y, placement.width, placement.height);
                    canvas.width = canvas.height = 0;
                    image.src = '';
                }
                const filename = document.getElementById('pdfFilename').value.trim().replace(/\.pdf$/i, '').replace(/[<>:"/\\|?*\x00-\x1f]/g, '_') || '合併圖片';
                pdf.save(`${filename}.pdf`);
                statusText.textContent = `已產生 ${imageItems.length} 頁 PDF，開始下載。`;
            } catch (error) { statusText.textContent = '製作失敗，圖片清單已保留。'; showModal(error.message || '無法產生 PDF，請減少圖片後再試。'); }
            finally { isBusy = false; updateControls(); }
        }

        // 綁定選檔、拖放、清除與下載事件。
        dropZone.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', () => addImages(Array.from(imageInput.files)));
        ['dragenter', 'dragover'].forEach(event => dropZone.addEventListener(event, e => { e.preventDefault(); if (!isBusy) dropZone.classList.add('drag-over'); }));
        ['dragleave', 'drop'].forEach(event => dropZone.addEventListener(event, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); }));
        dropZone.addEventListener('drop', e => addImages(Array.from(e.dataTransfer.files)));
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (isBusy) return;
            imageItems.forEach(item => URL.revokeObjectURL(item.url));
            imageItems = [];
            statusText.textContent = '';
            renderImages();
        });
        exportBtn.addEventListener('click', exportPdf);
    </script>
</body>
</html>
