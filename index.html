    <script>
        // 全域陣列，儲存從伺服器端載入的所有工具清單
        let allToolsList = [];

        document.addEventListener('DOMContentLoaded', () => {
            // 初始化搜尋功能與綁定事件
            initSearchEvents();
            // 開始動態獲取設定資料並繪製卡片
            fetchToolsData();
        });

        // 搜尋重導向處理邏輯
        function executeSearch(query) {
            const trimmedQuery = query.trim();
            if (trimmedQuery) {
                // 跳轉至搜尋頁面並帶入查詢參數
                window.location.href = `pages/search.html?q=${encodeURIComponent(trimmedQuery)}`;
            }
        }

        // 初始化所有搜尋框之鍵盤與點擊事件監聽
        function initSearchEvents() {
            const navInput = document.getElementById('navSearchInput');
            const navBtn = document.getElementById('navSearchBtn');
            const heroInput = document.getElementById('heroSearchInput');
            const heroBtn = document.getElementById('heroSearchBtn');

            // 1. 頂部導覽列搜尋按鈕點擊
            navBtn.addEventListener('click', () => {
                executeSearch(navInput.value);
            });

            // 2. 頂部導覽列搜尋框按下 Enter
            navInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    executeSearch(navInput.value);
                }
            });

            // 3. 主視覺區搜尋按鈕點擊
            heroBtn.addEventListener('click', () => {
                executeSearch(heroInput.value);
            });

            // 4. 主視覺區搜尋框按下 Enter
            heroInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    executeSearch(heroInput.value);
                }
            });
        }

        // 隨機選取不重複之項目
        function getRandomTools(toolsArray, count) {
            const shuffled = [...toolsArray].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // 封裝獨立的 HTML 生成模組，支援 Pro 徽章判斷
        function createToolCardHtml(tool) {
            // 檢查 JSON 中是否有設定 icon，若無則給予預設圖標 fa-toolbox
            const iconClass = tool.icon ? tool.icon : 'fa-solid fa-toolbox';
            
            // 檢查是否具有 Pro 屬性，若有則生成 Pro 金色徽章 HTML，若無則為空字串
            const proBadgeHtml = tool.pro === true 
                ? `<span class="pro-badge"><i class="fa-solid fa-crown"></i>PRO</span>` 
                : '';

            return `
                <a href="${tool.path}" class="tool-card" aria-label="開啟 ${tool.name} 工具">
                    <div class="tool-info">
                        <h3 class="tool-name">
                            <span style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                <i class="${iconClass}" style="color: var(--primary-color); width: 24px; text-align: center; font-size: 18px;"></i>
                                ${escapeHtml(tool.name)}
                                ${proBadgeHtml}
                            </span>
                            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                        </h3>
                        <p class="tool-desc" style="margin-left: 34px;">${escapeHtml(tool.description)}</p>
                    </div>
                    <div class="tool-footer" style="margin-left: 34px;">
                        <span>立即使用</span>
                    </div>
                </a>
            `;
        }

        // 渲染每日小驚喜區塊
        function renderDailySurprises() {
            const surpriseGrid = document.getElementById("surpriseGrid");
            
            if (allToolsList.length === 0) return;

            // 隨機抽選 3 個工具
            const surprises = getRandomTools(allToolsList, 2);
            surpriseGrid.innerHTML = "";

            // 將抽中的小工具加入驚喜面板
            surprises.forEach(tool => {
                surpriseGrid.innerHTML += createToolCardHtml(tool);
            });
        }

        // 觸發重新抽取小驚喜與按鈕旋轉動畫
        function refreshDailySurprises() {
            const refreshIcon = document.getElementById("refreshIcon");
            
            // 加入旋轉動畫 CSS class
            refreshIcon.classList.add("spinning");
            
            // 重新抽選並渲染
            renderDailySurprises();

            // 0.6 秒動畫完成後移除旋轉 class，方便下次再度觸發
            setTimeout(() => {
                refreshIcon.classList.remove("spinning");
            }, 600);
        }

        // 從 metadata.json 動態獲取並渲染所有卡片
        async function fetchToolsData() {
            const toolsGrid = document.getElementById('toolsGrid');
            const statusMessage = document.getElementById('statusMessage');

            try {
                // 發送請求讀取設定檔，防快取邏輯將由 init.js 統一處理
                const response = await fetch('config/metadata.json');
                
                if (!response.ok) {
                    throw new Error('無法取得工具清單資料');
                }

                allToolsList = await response.json();
                
                // 移除載入狀態訊息
                if (statusMessage) {
                    statusMessage.remove();
                }

                if (allToolsList.length === 0) {
                    toolsGrid.innerHTML = `
                        <div class="status-message">
                            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                            <p>目前沒有可用的工具</p>
                        </div>
                    `;
                    return;
                }

                // 首次加載時，同步渲染「每日小驚喜」面板
                renderDailySurprises();

                // 渲染常規完整工具清單
                allToolsList.forEach((tool) => {
                    toolsGrid.innerHTML += createToolCardHtml(tool);
                });

            } catch (error) {
                // 處理連線與解析異常狀態
                console.error('Error fetching tools metadata:', error);
                if (statusMessage) {
                    statusMessage.innerHTML = `
                        <i class="fa-solid fa-triangle-exclamation" style="color: #e74c3c;" aria-hidden="true"></i>
                        <p>載入工具失敗，請稍後再試</p>
                    `;
                }
            }
        }

        // 簡單的 HTML 轉義函式，預防 XSS 注入攻擊
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, (m) => map[m]);
        }
    </script>
</body>
</html>
